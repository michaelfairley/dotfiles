# Set up a new machine from this repo with:
#
#   mise bootstrap --from git@github.com:michaelfairley/dotfiles.git --from-dir ~/p/dotfiles
#
# After that, rerun `mise bootstrap` from this directory whenever this file changes.
# Preview with `mise bootstrap --dry-run`.

[vars]
# The snippets/ templates don't see config_root directly, so pass it through.
dotfiles_dir = "{{ config_root }}"

[dotfiles]
"~/.emacs" = { source = ".emacs" }
"~/.emacs.d" = { source = ".emacs.d" }
"~/.gitignore" = { source = ".gitignore" }
"~/.inputrc" = { source = ".inputrc" }

# ~/.zshrc, ~/.bashrc, and ~/.gitconfig stay machine-local so installers (and
# `git config --global`) can append to them. mise only owns a block in each that
# loads the tracked version from this repo.
"~/.zshrc/dotfiles" = { source = "snippets/zshrc", template = "tera" }
"~/.bashrc/dotfiles" = { source = "snippets/bashrc", template = "tera" }
"~/.gitconfig/dotfiles" = { source = "snippets/gitconfig", template = "tera" }

# Shims in ~/.zprofile, full activation in ~/.zshrc. bash activates from .bashrc,
# guarded, since non-login bash doesn't have Homebrew on PATH.
[bootstrap.mise_shell_activate]
zsh = true

[bootstrap.packages]
