# Set up a new machine from this repo with:
#
#   mise bootstrap --from git@github.com:michaelfairley/dotfiles.git --from-dir ~/p/dotfiles
#
# After that, rerun `mise bootstrap` from this directory whenever this file changes.
# Preview with `mise bootstrap --dry-run`.

[vars]
# The snippets/ templates don't see config_root directly, so pass it through.
dotfiles_dir = "{{ config_root }}"

[tasks.settings-drift]
description = "Show local changes to merged app settings that may belong in snippets/"
tools.python = "3.13"
run = "bin/settings-drift"

# Every Mac must pick exactly one role in ~/.config/mise/miserc.local.toml
# (env = ["desktop"] or env = ["laptop"]); otherwise its module would be
# silently skipped. Runs before bootstrap changes anything.
[bootstrap.hooks]
pre-packages = '''
envs=$(printf %s "{% if mise_env is defined %}{{ mise_env | join(sep=",") }}{% endif %}" | tr -d "[:space:]")
case ",$envs," in
  *,desktop,*laptop,* | *,laptop,*desktop,*) roles=2 ;;
  *,desktop,* | *,laptop,*) roles=1 ;;
  *) roles=0 ;;
esac
if [ "$roles" -ne 1 ]; then
  echo 'Select exactly one of desktop or laptop: put env = ["desktop"] or env = ["laptop"] in ~/.config/mise/miserc.local.toml, then rerun.' >&2
  exit 1
fi
'''

[dotfiles]
"~/.emacs" = { source = ".emacs" }
"~/.emacs.d" = { source = ".emacs.d" }
"~/.gitignore" = { source = ".gitignore" }
"~/.inputrc" = { source = ".inputrc" }
"~/.psqlrc" = { source = ".psqlrc" }
"~/.bundle/config" = { source = "bundle/config" }
"~/.config/ghostty/config" = { source = "ghostty/config" }
"~/.config/zed/settings.json" = { source = "zed/settings.json" }
"~/.config/zed/tasks.json" = { source = "zed/tasks.json" }
"~/.claude/CLAUDE.md" = { source = "claude/CLAUDE.md" }

# ~/.zshrc, ~/.bashrc, and ~/.gitconfig stay machine-local so installers (and
# `git config --global`) can append to them. mise only owns a block in each that
# loads the tracked version from this repo.
"~/.zshrc/dotfiles" = { source = "snippets/zshrc", template = "tera" }
"~/.bashrc/dotfiles" = { source = "snippets/bashrc", template = "tera" }
"~/.gitconfig/dotfiles" = { source = "snippets/gitconfig", template = "tera" }

# These apps rewrite their own settings files, so mise owns only the keys in each
# snippet. `merge = "missing"` entries are defaults the app may change later
# (e.g. via /model); they're only filled in when unset.
"~/.claude/settings.json/dotfiles" = { source = "snippets/claude-settings.json", merge = true }
"~/.claude/settings.json/defaults" = { source = "snippets/claude-settings-defaults.json", merge = "missing" }
"~/.codex/config.toml/dotfiles" = { source = "snippets/codex-config.toml", merge = true }
"~/.codex/config.toml/defaults" = { source = "snippets/codex-config-defaults.toml", merge = "missing" }
"~/.gemini/settings.json/dotfiles" = { source = "snippets/gemini-settings.json", merge = true }

# Shims in ~/.zprofile, full activation in ~/.zshrc. bash activates from .bashrc,
# guarded, since non-login bash doesn't have Homebrew on PATH.
[bootstrap.mise_shell_activate]
zsh = true

# macOS preferences. mise never deletes a preference, so removing a line here
# leaves the current value; use `defaults delete <domain> <key>` to reset one.
# Dock, Finder, and the menu bar pick up changes after
# `killall Dock Finder SystemUIServer`.
[bootstrap.macos.dock]
autohide = true
mru_spaces = false

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
show_status_bar = true
save_new_documents_to_cloud = false

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15
automatic_capitalization = false
automatic_spelling_correction = false

[bootstrap.macos.defaults.NSGlobalDomain]
AppleShowAllExtensions = true
AppleShowScrollBars = "Always"
_HIHideMenuBar = true
NSAutomaticDashSubstitutionEnabled = false
NSAutomaticPeriodSubstitutionEnabled = false
NSAutomaticQuoteSubstitutionEnabled = false
WebAutomaticSpellingCorrectionEnabled = false
"com.apple.swipescrolldirection" = false # natural scrolling off
"com.apple.sound.uiaudio.enabled" = 0 # no UI sound effects
"com.apple.sound.beep.sound" = "/System/Library/Sounds/Tink.aiff"
"com.apple.mouse.scaling" = 2.0
"com.apple.scrollwheel.scaling" = 0.5

[bootstrap.macos.defaults."com.apple.dock"]
tilesize = 56.0 # Dock stores this as a real, so not the integer `dock.tilesize`
"expose-animation-duration" = 0.1
"wvous-br-corner" = 1 # no bottom-right hot corner
"wvous-br-modifier" = 0

[bootstrap.macos.defaults."com.apple.screencapture"]
"show-thumbnail" = true
showsCursor = true

[bootstrap.macos.defaults."com.apple.WindowManager"]
EnableStandardClickToShowDesktop = false # clicking wallpaper only reveals desktop in Stage Manager
EnableTiledWindowMargins = false
HideDesktop = true
StandardHideWidgets = true
StageManagerHideWidgets = true

[bootstrap.macos.defaults."com.apple.desktopservices"]
DSDontWriteNetworkStores = true
DSDontWriteUSBStores = true

# Don't open Photos when a phone or camera is plugged in.
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.ImageCapture"
key = "disableHotPlug"
host = "current"
value = true

# When a cask's app is already installed by hand, take it over instead of
# replacing it, so it keeps its macOS privacy permissions and isn't downgraded.
# A cask can opt out with `adopt = false`.
[bootstrap.brew]
adopt = true

